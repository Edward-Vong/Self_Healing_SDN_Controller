# CloudLab topology defaults used by run_experiment.sh.
# These values are defaults. Any explicit CLI arg can override them.

# SSH username for remote command prefixes.
USER="viliang"

# Controller REST endpoint used by collectors and config APIs.
CONTROLLER="http://128.110.223.12:8080"

# Node roles for distributed experiments.
# SSH management addresses (CloudLab eth0) — must NOT be 10.10.10.x dataplane IPs.
TRUSTED="hpvm126-1.utah.cloudlab.us"
ATTACKER="hpvm126-2.utah.cloudlab.us"
VICTIM="hpvm126-3.utah.cloudlab.us"

# Dataplane IPs (OVS bridge addresses on the experiment LAN).
# The CloudLab topology uses three separate point-to-point /24 subnets:
#   10.10.1.x  trusted  (10.10.1.1) <-> attacker (10.10.1.2)
#   10.10.2.x  trusted  (10.10.2.1) <-> victim   (10.10.2.2)
#   10.10.3.x  attacker (10.10.3.1) <-> victim   (10.10.3.2)
# VICTIM_DATA_IP    = victim's IP on the attacker-victim subnet  (attack target)
# VALID_TARGET_IP   = victim's IP on the trusted-victim subnet   (ping/iperf target)
TRUSTED_DATA_IP="10.10.2.1"
ATTACKER_DATA_IP="10.10.3.1"
VICTIM_DATA_IP="10.10.3.2"
VALID_TARGET_IP="10.10.2.2"

# Repository root on remote nodes. Used to derive remote script path:
# REMOTE_SCRIPT_DIR defaults to "$PROJECT_DIR/experiment_scripts".
# Set this to the absolute path where the repo is cloned on each CloudLab node.
PROJECT_DIR="/users/viliang/Self_Healing_SDN_Controller"

# Controller node interface for optional link utilization metrics.
CONTROLLER_IFACE="eth0"

# OVS bridge names to clear locally at experiment start.
# Mininet default:  OVS_SWITCHES="s1 s2 s3 s4"
# CloudLab example: OVS_SWITCHES="ovs-lan1 ovs-lan2 ovs-lan3"
OVS_SWITCHES="ovs-lan1 ovs-lan2 ovs-lan3"

# Comma-separated management IPs to probe for RTT during each experiment run.
# Passed to collect_metrics.py --switch-ips; written to switch_rtt.csv.
# Uses management IPs (reachable from the controller node, not dataplane 10.10.10.x).
SWITCH_MONITOR_IPS="128.110.223.8,128.110.223.13,128.110.223.15"
